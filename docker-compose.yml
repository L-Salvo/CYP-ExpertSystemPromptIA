# =============================================================
# Docker Compose — Backend + PostgreSQL + Prolog real
# -------------------------------------------------------------
# Servicios:
#   postgres  — base de datos
#   prolog    — motor de inferencias SWI-Prolog (servicio real)
#   backend   — Spring Boot; usa PrologRestClient contra `prolog`
#
# NO incluye todavía:
#   - frontend
#   - proveedor real de IA (AI sigue en mock)
# =============================================================

services:

  # ---------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cyp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Persistencia de datos entre reinicios.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ---------------------------------------------------------
  # Prolog — motor de inferencias real (SWI-Prolog HTTP)
  # ---------------------------------------------------------
  prolog:
    build:
      context: ./prompt.expert_prolog
    container_name: cyp-prolog
    environment:
      PROLOG_PORT: 8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  # ---------------------------------------------------------
  # Backend Spring Boot
  # ---------------------------------------------------------
  backend:
    build:
      context: ./prompt.expert_backend
    container_name: cyp-backend
    depends_on:
      postgres:
        condition: service_healthy
      prolog:
        condition: service_healthy
    environment:
      # Perfil dockerizado.
      SPRING_PROFILES_ACTIVE: docker

      # Conexión a postgres por nombre de servicio (NO localhost).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      # Prolog real: PrologRestClient contra el servicio `prolog`.
      # PROLOG_MOCK=false activa PrologRestClient (sin tocar código Java).
      PROLOG_MOCK: ${PROLOG_MOCK:-false}
      PROLOG_SERVICE_BASE_URL: ${PROLOG_SERVICE_BASE_URL:-http://prolog:8081}

      # IA: sigue en mock (fuera del alcance de esta fase).
      AI_MOCK: ${AI_MOCK:-true}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
