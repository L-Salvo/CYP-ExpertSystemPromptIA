# Base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/expert_prompts_dev
spring.datasource.username=expert_user
spring.datasource.password=expert_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Permite que data.sql se ejecute DESPUÉS de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true

# SQL init — necesario para que Spring ejecute data.sql en BD no embebida (PostgreSQL)
spring.sql.init.mode=always

# Prolog (mock en dev)
prolog.mock=true
prolog.service.base-url=http://localhost:8081

# AI (mock en dev)
ai.mock=true

# Logging
logging.level.com.cyp=DEBUG
