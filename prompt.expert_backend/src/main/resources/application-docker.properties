# =============================================================
# Perfil DOCKER — PASO 20 base (postgres + backend)
# -------------------------------------------------------------
# Se usa cuando el backend corre dentro de Docker Compose.
# A diferencia de `prod`, este perfil NO depende todavía del
# servicio Prolog ni del proveedor de IA: ambos quedan en MOCK.
#
# La estructura está preparada para el SIGUIENTE paso (Prolog):
# basta con poner PROLOG_MOCK=false y PROLOG_SERVICE_BASE_URL
# como variables de entorno; no hay que tocar código.
# =============================================================

# --- Base de datos (inyectada por Docker Compose vía env) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
# Hibernate crea/actualiza el esquema. El volumen de postgres
# persiste los datos entre reinicios (no se borran como en create-drop).
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Permite que data.sql corra DESPUÉS de que Hibernate crea las tablas.
spring.jpa.defer-datasource-initialization=true

# --- Seed (data.sql) ---
# El seed es idempotente (ON CONFLICT DO NOTHING), así que es seguro
# ejecutarlo en cada arranque aunque el volumen ya tenga datos.
spring.sql.init.mode=always

# --- Prolog (MOCK en esta base; se activa por env en el próximo paso) ---
prolog.mock=${PROLOG_MOCK:true}
prolog.service.base-url=${PROLOG_SERVICE_BASE_URL:http://prolog:8081}
prolog.service.connect-timeout-ms=${PROLOG_SERVICE_CONNECT_TIMEOUT_MS:3000}
prolog.service.read-timeout-ms=${PROLOG_SERVICE_READ_TIMEOUT_MS:10000}

# --- IA (MOCK; el proveedor real queda fuera del alcance de este paso) ---
ai.mock=${AI_MOCK:true}

# --- Logging ---
logging.level.com.cyp=INFO
