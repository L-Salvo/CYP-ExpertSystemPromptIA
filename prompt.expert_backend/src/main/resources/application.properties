spring.application.name=prompt-expert-backend
server.port=8080

# JPA
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Jackson
# Spring Boot 4 usa Jackson 3: write-dates-as-timestamps pasó de SerializationFeature a DateTimeFeature
spring.jackson.datetime.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
