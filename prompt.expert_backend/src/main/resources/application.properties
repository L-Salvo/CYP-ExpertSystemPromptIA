spring.application.name=prompt-expert-backend
server.port=8080

# JPA
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Jackson
# Spring Boot 4 usa Jackson 3: write-dates-as-timestamps pasó de SerializationFeature a DateTimeFeature
spring.jackson.datetime.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Actuator
# Decisión arquitectónica: exponer ÚNICAMENTE health e info. Ningún otro endpoint.
management.endpoints.web.exposure.include=health,info
# Seguridad: no filtrar detalles internos (BD, disco, etc.) en /actuator/health.
management.endpoint.health.show-details=never
# Contenido de /actuator/info derivado de las propiedades info.* declaradas abajo.
management.info.env.enabled=true

info.app.name=Sistema Experto para Personalización de Prompts
info.app.description=Backend de enriquecimiento de prompts mediante SWI-Prolog
info.app.version=0.0.1-SNAPSHOT
