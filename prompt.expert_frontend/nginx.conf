# =============================================================
# nginx.conf — Servir el SPA + reverse-proxy de la API
# -------------------------------------------------------------
# - Sirve los estáticos compilados de Vite.
# - Fallback a index.html para las rutas client-side de react-router
#   (/, /chat/:chatId) → evita 404 en deep-links / refresh.
# - Proxy /api → backend:8080. El cliente axios usa baseURL '/api'
#   (relativo), así que el navegador ve UN SOLO origen (el del front)
#   y no hay CORS. El backend no se modifica.
# =============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión básica para los assets de texto.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash de Vite → cache larga e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy a la API del backend (resolución DNS por nombre de servicio).
    # Se conserva el prefijo /api/ porque el backend expone sus endpoints bajo /api.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # SPA: cualquier otra ruta cae en index.html (routing en el cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
